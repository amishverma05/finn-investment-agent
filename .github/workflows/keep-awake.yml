# Render's free plan puts the backend to sleep after 15 minutes without requests, which
# would also pause the background scheduler (filings watcher, alerts, notifications).
# This pings the health endpoint every 5 minutes to keep it awake. Free for public repos.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "Set the BACKEND_URL repository variable"; exit 0; fi
          # A sleeping service can take up to a minute to wake up.
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "$BACKEND_URL/health"
